name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 gives the merge base something to reach. It is NOT by
      # itself what makes the docstring ratchet enforce here: actions/checkout
      # leaves a detached HEAD with no local `main` ref, so `git merge-base HEAD
      # main` exits 128 even on a full clone. internal/gitdiff resolves that by
      # retrying `origin/<base>`; full history is what makes that retry able to
      # find a common ancestor. Both halves are required.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Go build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # The suite runs INSIDE centinela validate: validate.commands executes
      # the single profiled `go test ./...` run and the coverage gate reuses
      # its profile. No bare suite step — one full-suite execution per push.
      - name: Run centinela validate
        run: go run ./cmd/centinela validate

  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Render gate verdict
        run: go run ./cmd/centinela pr-gate > /tmp/verdict.md || true

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/verdict.md --edit-last \
            || gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/verdict.md

      - name: Enforce gate exit code
        run: go run ./cmd/centinela pr-gate
